<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender and quiet, a parent's letter kept for eighteen years
   IDEA: a stationery box; opening the app opens an envelope, inside is today's blank letter
   PICTURE: intro envelope that floats in and opens; the writing form is the page's picture
   COLOUR and TYPE: white paper, ink black, indigo wax; Shippori Mincho + Zen Kaku Gothic New
   LAYOUT: intro overlay → two tabs (書く: catch + countdown + form / 送った手紙: 18-slot shelf + log) */
:root{color-scheme:light dark;--bg:light-dark(#fff,#121315);--paper:light-dark(#fff,#1b1c1f);--ink:light-dark(#1c1c1f,#f1f1f3);--mute:light-dark(#85858b,#9b9ba3);--line:light-dark(#e6e6ea,#2d2e33);--soft:light-dark(#f5f5f7,#1f2024);--seal:light-dark(#8a1c1c,#a8332d);--sealHi:light-dark(#c4433b,#dc6a60);--btn:light-dark(#3d3b39,#e7e4e0);--btnInk:light-dark(#fff,#1d1c1b);--warn:light-dark(#a8463d,#e48d84)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 max(5vw,18px)}
.wide-wrap{max-width:1040px}

/* ---- intro ---- */
#intro{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;cursor:pointer;transition:opacity .7s ease}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:min(78vw,380px);height:auto;overflow:visible}
#intro .skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;color:var(--mute)}
.i-env{opacity:0;transform:translateY(24px);animation:float 1.1s cubic-bezier(.2,.7,.2,1) .15s forwards}
.i-paper{fill:var(--paper);stroke:var(--line);stroke-width:1.5}.i-shade{fill:var(--soft)}
.i-flap,.i-flapo{transform-box:fill-box}
.i-flap{transform-origin:50% 0}
.i-flapo{transform-origin:50% 100%;transform:scaleY(0)}
.i-letter{opacity:0}
#intro.auto .i-flap{animation:shut .38s ease-in 1.15s forwards}
#intro.auto .i-flapo{animation:open .45s ease-out 1.53s forwards}
#intro.auto .i-seal{animation:fade .3s ease 1s forwards}
#intro.auto .i-letter{animation:show .01s linear 1.5s forwards,rise .9s cubic-bezier(.2,.7,.2,1) 1.95s forwards}
#intro.gift.go .i-seal{transform-box:fill-box;transform-origin:12% 88%;animation:peel .85s cubic-bezier(.4,0,.6,1) forwards}
@keyframes peel{0%{transform:none}25%{transform:rotate(-10deg) translate(3px,-5px) scale(1.04)}55%{transform:rotate(-34deg) translate(26px,-34px) scale(1.08)}100%{transform:rotate(-80deg) translate(120px,60px) scale(.9);opacity:0}}
#intro.go .i-seal{animation:fade .3s ease .05s forwards}
#intro.go .i-flap{animation:shut .38s ease-in .2s forwards}
#intro.gift.go .i-flap{animation-delay:.8s}#intro.gift.go .i-flapo{animation-delay:1.18s}#intro.gift.go .i-letter{animation-delay:1.15s,1.6s}
#intro.go .i-flapo{animation:open .45s ease-out .58s forwards}
#intro.go .i-letter{animation:show .01s linear .55s forwards,rise .9s cubic-bezier(.2,.7,.2,1) 1s forwards}
#intro .msg{position:absolute;top:calc(14vh + env(safe-area-inset-top));left:0;right:0;text-align:center;padding:0 24px}
#intro .msg b{display:block;font:500 clamp(26px,6vw,34px)/1.4 "Shippori Mincho",serif;color:var(--ink)}
#intro.gift .i-env{cursor:pointer}
#intro.gift:not(.go) .i-seal{animation:pulse 2.4s ease-in-out 1.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes show{to{opacity:1}}
.i-letter rect.p{fill:var(--paper);stroke:var(--line);stroke-width:1.5}.i-letter .w rect{fill:var(--seal);opacity:.55}
.i-letter text{fill:var(--ink);font:500 20px "Shippori Mincho",serif;text-anchor:middle}
.wax{fill:url(#wax);filter:drop-shadow(0 3px 4px rgb(80 0 0/.28))}.ring{fill:none;stroke:rgb(255 255 255/.25);stroke-width:1.2}.ring2{fill:none;stroke:rgb(0 0 0/.18);stroke-width:2}.num{fill:#fff;font:500 30px "Shippori Mincho",serif;text-anchor:middle;opacity:.92}
@keyframes float{to{opacity:1;transform:none}}
@keyframes shut{to{transform:scaleY(0)}}
@keyframes open{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:0}}
@keyframes rise{to{transform:translateY(-150px)}}
@media(prefers-reduced-motion:reduce){.i-env,.i-flap,.i-flapo,.i-seal,.i-letter{animation-duration:.01s!important;animation-delay:0s!important}}

/* ---- header & tabs ---- */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.mark{font:600 15px/1 "Shippori Mincho",serif;letter-spacing:.06em}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--mute);font:500 14px "Zen Kaku Gothic New",sans-serif;min-height:38px;padding:0 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.08)}
.note{font-size:13px;color:var(--mute)}
main{animation:appear .6s ease both}@keyframes appear{from{opacity:0;transform:translateY(8px)}}

h1{font:500 clamp(32px,6vw,46px)/1.3 "Shippori Mincho",serif;margin:0 0 12px;text-wrap:balance}
h2{font:500 22px/1.4 "Shippori Mincho",serif;margin:0}
h3{font:500 24px/1.45 "Shippori Mincho",serif;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin:0}
.catch{padding:clamp(32px,6vw,56px) 0 28px;text-align:center}
.count{display:flex;gap:18px;justify-content:center;align-items:baseline;margin:22px 0 4px}
.count b{font:500 clamp(36px,8vw,50px)/1 "Shippori Mincho",serif;font-variant-numeric:tabular-nums}
.count span{color:var(--mute);font-size:14px;margin-left:3px}
.form{border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);margin-bottom:56px;background:var(--paper)}

.btn{text-decoration:none;appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btnInk);font:500 16px/1 "Zen Kaku Gothic New",sans-serif;padding:0 26px;min-height:50px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.row{margin:0 0 22px}.row>label,.lab{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px "Zen Kaku Gothic New",sans-serif;min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.seg input{width:130px}
input,select,textarea{font:16px "Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;text-align:left}input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
textarea{resize:vertical;line-height:1.7}
.rec{border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--bg)}
.wave{width:100%;height:64px;display:block;color:var(--sealHi)}
.recbtn{appearance:none;width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;margin:8px auto 4px}
.recbtn i{width:26px;height:26px;border-radius:50%;background:var(--warn);transition:border-radius .2s,width .2s,height .2s}
.recbtn.on i{border-radius:5px;width:22px;height:22px}
.time{font:500 20px "Shippori Mincho",serif;font-variant-numeric:tabular-nums}
audio{width:100%;margin-top:12px}
.file{display:inline-flex;align-items:center;min-height:44px;color:var(--seal);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{max-width:100%;border-radius:10px;margin-top:10px;display:block}
.full{width:100%}
.pair{display:flex;gap:10px;margin-top:8px}.pair .btn{flex:1;white-space:nowrap;padding:0 14px}

/* ---- sent tab ---- */
.sent-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px;padding:32px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);min-height:150px}
.card.empty{border-style:dashed;background:transparent}
.card.next{border:1px solid var(--seal)}
.mini{position:relative;height:46px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(to bottom right,transparent calc(50% - .75px),var(--line) 50%,transparent calc(50% + .75px)) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent calc(50% - .75px),var(--line) 50%,transparent calc(50% + .75px)) right/50% 100% no-repeat}
.card.empty .mini{opacity:.45}
.dot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sealHi),var(--seal))}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ct b{font:500 18px "Shippori Mincho",serif}.ct small{font-size:13px;color:var(--mute);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:500 13px/1 "Zen Kaku Gothic New",sans-serif;padding:0 12px;min-height:34px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.add{border-color:var(--seal);color:var(--seal);background:transparent}
.log{border-top:1px solid var(--line);margin-top:40px;padding:28px 0 56px}
.log ul{list-style:none;padding:0;margin:12px 0 0}.log li{font-size:14px;color:var(--mute);padding:8px 0;border-bottom:1px solid var(--line)}

/* ---- sheet ---- */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 28%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{position:relative;background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:28px clamp(18px,5vw,36px) calc(28px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.x{position:absolute;top:14px;right:14px;appearance:none;border:0;background:none;color:var(--mute);font:14px "Zen Kaku Gothic New",sans-serif;min-height:44px;padding:0 10px;cursor:pointer}
.lock{text-align:center;padding:12px 0 4px}
.hold{appearance:none;border:0;background:none;cursor:pointer;width:132px;height:132px;position:relative;margin:26px auto 10px;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold svg{position:absolute;inset:0}
.hold .bg{fill:none;stroke:var(--line);stroke-width:3}.hold .prog{fill:none;stroke:var(--seal);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.hold .wx{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sealHi),var(--seal));box-shadow:inset 0 0 0 7px color-mix(in srgb,var(--seal) 70%,#000 0%),inset 0 0 0 8px rgb(255 255 255/.22),0 3px 8px rgb(80 0 0/.25);display:grid;place-items:center;color:#fff;font:500 26px "Shippori Mincho",serif;transition:transform .2s}
.hold:active .wx{transform:scale(.96)}
.phrase{font:500 18px "Shippori Mincho",serif;-webkit-user-select:none;user-select:none;margin:6px 0 12px}
.err{color:var(--warn);font-size:14px;min-height:22px;margin:6px 0 0}
.letter{white-space:pre-wrap;font:17px/2 "Shippori Mincho",serif;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.eyebrow{font-size:13px;color:var(--mute);margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btnInk);padding:12px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
@media(max-width:420px){#app .mark{display:none}#app .bar{justify-content:center}}

.setup{max-width:440px;margin:0 auto;padding:clamp(40px,8vw,72px) 0 64px;text-align:center}
.setup .form{text-align:left;margin-top:28px}
.setup .seg button{flex:1}
.me{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-top:14px}
.me button{appearance:none;border:0;background:none;color:var(--seal);font:13px "Zen Kaku Gothic New",sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px;padding:0 4px}
.clock{font:500 clamp(18px,4.5vw,22px)/1 "Shippori Mincho",serif;font-variant-numeric:tabular-nums;color:var(--mute);margin-top:12px;letter-spacing:.04em}
.clock span{font-size:12px;margin:0 6px 0 2px}
.target{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.target b{font:500 20px "Shippori Mincho",serif}
.tabs button{padding:0 14px}
@media(max-width:420px){.tabs button{padding:0 11px;font-size:13px}}
.linkbtn{appearance:none;border:0;background:none;color:var(--seal);font:14px "Zen Kaku Gothic New",sans-serif;cursor:pointer;min-height:44px;padding:0 4px}
.send{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--seal);border-radius:14px;padding:20px;margin-bottom:24px}
.send b{font:500 20px "Shippori Mincho",serif;display:block;margin-bottom:4px}
.send>div{flex:1 1 260px}
.set{display:grid;gap:20px;padding:32px 0 64px}
.set h2{margin-bottom:4px}
.set .form{margin:0}
.glist{display:grid;gap:10px;padding-bottom:64px}
.gl{appearance:none;width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 16px;cursor:pointer;font:inherit}
.gl .mini{height:40px}.gl.done .dot{opacity:.35}
.gl b{font:500 18px "Shippori Mincho",serif;display:block}.gl small{color:var(--mute);font-size:13px}
.gl .gd{font-size:13px;color:var(--mute);white-space:nowrap}
.unseal{width:96px;height:96px;margin:4px auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sealHi),var(--seal));display:grid;place-items:center;color:#fff;font:500 30px "Shippori Mincho",serif}
@media(prefers-reduced-motion:no-preference){.unseal{animation:crack 1s ease .2s forwards}@keyframes crack{to{transform:scale(1.25);opacity:0;height:0;margin:0}}}
.reveal{text-align:center}
.reveal audio{margin-top:18px}
/* ---- 送った手紙 ---- */
.envs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px}
@media(min-width:640px){.envs{grid-template-columns:repeat(6,minmax(0,1fr))}}
.env{appearance:none;border:0;background:none;padding:0;color:var(--ink);font:inherit;display:block;width:100%;cursor:pointer;text-align:center}
.env:disabled{cursor:default}
.env svg{width:100%;height:auto;display:block;overflow:visible}
.env .pp{fill:var(--paper);stroke:var(--line);stroke-width:1.2}
.env .fl{fill:none;stroke:var(--line);stroke-width:1.2}
.env .sl{fill:url(#waxS)}
.env .sn{fill:#fff;font:500 15px "Shippori Mincho",serif;text-anchor:middle}
.env .en{fill:var(--mute);font:500 20px "Shippori Mincho",serif;text-anchor:middle}
.env.sealed .pp{filter:drop-shadow(0 4px 8px rgb(0 0 0/.06))}
.env.next .pp{stroke:var(--seal);stroke-dasharray:4 3}.env.next .en{fill:var(--seal)}
.env.empty .pp{stroke-dasharray:4 3}
.env.future{opacity:.3}
.env small{display:block;margin-top:8px;font-size:12px;color:var(--mute);min-height:18px;white-space:nowrap}
.env.next small{color:var(--seal)}
.env:focus-visible{outline:2px solid var(--seal);outline-offset:4px;border-radius:6px}
@media(prefers-reduced-motion:no-preference){.env.sealed{animation:in .5s ease both}}
.sum{padding:clamp(32px,6vw,52px) 0 30px;text-align:center}
.big{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:6px}
.big b{font:500 clamp(60px,15vw,88px)/1 "Shippori Mincho",serif;font-variant-numeric:tabular-nums}
.big span{font-size:16px;color:var(--mute)}
.thread{position:relative;display:flex;justify-content:space-between;align-items:center;height:20px;margin:28px 2px 8px}
.thread::before,.thread::after{content:"";position:absolute;left:0;top:50%;height:1px}
.thread::before{right:0;background:var(--line)}.thread::after{width:var(--p,0%);background:var(--seal)}
.thread i{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.thread i.s{width:12px;height:12px;border:0;background:radial-gradient(circle at 35% 35%,var(--sealHi),var(--seal))}
.thread i.n{width:12px;height:12px;border:1.5px solid var(--seal);box-shadow:0 0 0 4px color-mix(in srgb,var(--seal) 14%,transparent)}
.thread-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tr{position:relative;display:grid;grid-template-columns:64px 20px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.ta{text-align:right;white-space:nowrap}.ta b{font:500 30px/1 "Shippori Mincho",serif;display:block;font-variant-numeric:tabular-nums}.ta span{font-size:12px;color:var(--mute)}
.tm{position:relative;display:flex;justify-content:center;padding-top:9px}
.tm::before{content:"";position:absolute;left:50%;top:-18px;bottom:-18px;width:1px;background:var(--line)}
.tr:first-child .tm::before{top:14px}.tr:last-child .tm::before{bottom:auto;height:32px}
.node{position:relative;z-index:1}
.node{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}
.tr.sealed .node{border:0;width:13px;height:13px;background:radial-gradient(circle at 35% 35%,var(--sealHi),var(--seal))}
.tr.next .node{border:1.5px solid var(--seal);box-shadow:0 0 0 4px color-mix(in srgb,var(--seal) 14%,transparent)}
.tr.next{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--seal) 6%,transparent) 30%,transparent)}
.tb{padding-top:4px}.tb small{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
.tr.future{opacity:.38}.tr.future .tb small{margin:0}
.tl .chips{margin:0}
.chip.w{display:inline-flex;align-items:center;gap:8px;background:var(--paper)}
.chip.w::before{content:"";width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sealHi),var(--seal))}
.chip.add{border-style:dashed}
.sendband{background:var(--btn);color:var(--btnInk);border-radius:18px;padding:clamp(24px,5vw,36px);margin-top:40px;display:grid;gap:18px}
.sendband b{font:500 24px/1.4 "Shippori Mincho",serif;display:block}
.sendband p{margin:6px 0 0;font-size:14px;opacity:.72}
.sendband .btn{background:var(--btnInk);color:var(--btn);border-color:var(--btnInk);justify-self:start}
@media(prefers-reduced-motion:no-preference){.tr.sealed{animation:in .5s ease both}}
.so{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;align-content:center;gap:28px;padding:24px;transition:opacity .5s}
.so.out{opacity:0}
.so svg{width:min(78vw,360px);height:auto;overflow:visible}
.so-env{transform-box:view-box;transform-origin:50% 60%}
.so-letter{transform:translateY(-150px);animation:sink .8s cubic-bezier(.4,0,.2,1) .25s forwards}
@keyframes sink{99%{opacity:1;transform:none}to{opacity:0;transform:none}}
.so-flapo{transform-box:fill-box;transform-origin:50% 100%;animation:shut .3s ease-in 1.05s forwards}

<!-- ======== 初回設定 ======== -->
<section id="setup" hidden><div class="wrap"><div class="setup">
  <h1>はじめに</h1>
  <div class="form">
    <div class="row" id="nmRow"><label for="nm">子どもの名前</label><input id="nm" maxlength="20" placeholder="例：はると"></div>
    <div class="row" id="bdRow"><label for="bd">子どもの誕生日</label><input type="date" id="bd"></div>
    <p class="note" id="bdSet" hidden></p>

</div></div></section>

<!-- ======== 声を登録する側 ======== -->
<div id="app" hidden>
<header><div class="wrap wide-wrap bar">
  <span class="mark">Voice Letters</span>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="write" aria-selected="true">手紙を書く</button>
    <button role="tab" data-tab="sent" aria-selected="false">送った手紙</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定</button>
  </nav>
</div></header>
<main>
<section id="p-write" role="tabpanel"><div class="wrap">
  <div class="catch">
    <h1 id="title">18歳のきみへ<span>毎年の想いと思い出を声にのせる</span></h1>
    <div class="count" id="count"></div>
    <div class="clock" id="clock"></div>
    <p class="note" id="mode"></p>
  </div>
  <div class="letterwrap" id="form"></div>
</div></section>

<section id="p-sent" role="tabpanel" hidden><div class="wrap">
  <div class="sum">
    <div class="big"><b id="sumN">0</b><span id="sumT">/ 18</span></div>
  </div>
  <div class="envs" id="grid"></div>
  <div class="sendband" id="sendCard"></div>
  <div style="height:56px"></div>
</div></section>

<section id="p-settings" role="tabpanel" hidden><div class="wrap"><div class="set">
  <div><h2>子どものこと</h2><p class="sub">家族みんなで共通の設定です。</p></div>
  <div class="form">
    <div class="row"><label for="sBd">誕生日</label><input type="date" id="sBd"><p class="note" style="margin:8px 0 0">変えると開封日も変わります。</p></div>
    <div class="row"><label for="sName">呼び名（受け取る画面に出ます）</label><input id="sName" maxlength="20" placeholder="きみ"></div>
    <div class="row"><label for="sTz">標準時間</label><select id="sTz"></select><p class="note" style="margin:8px 0 0">開封日の0時をどの国の時間で数えるか。</p></div>
    <p class="err" id="sErr"></p>
    <button class="btn full" id="sSave">保存する</button>
  </div>
  <div><h2>差出人の名前</h2><p class="sub">手紙の「〇〇より」に入ります。このスマホだけの設定です。</p></div>
  <div class="form"><div class="row" style="margin-bottom:14px"><input id="sWho" maxlength="20" aria-label="差出人の名前"></div>
   <label class="chk"><input type="checkbox" id="sWhoAll" checked> これまでの手紙の差出人もまとめて変える</label>
   <button class="btn full" id="sWhoSave" style="margin-top:16px">差出人を変える</button></div>
  <div id="invHead" hidden><h2>家族を招待</h2><p class="sub">パパとママで、同じ子どもへの手紙を一緒に貯められます。お互いの声は聴けません。</p></div>
  <div class="form" id="invForm" hidden><div class="row"><label for="invMail">招待する人のGmail</label><input type="email" id="invMail" autocomplete="off" inputmode="email" placeholder="example@gmail.com"></div>

  <div><h2>受け取る側の画面</h2><p class="sub">送付したリンクを開くと、この画面が出ます。</p></div>
  <div class="form"><button class="btn ghost full" id="sPreview">受け取る側の画面を見る</button></div>
</div></div></section>
</main>
</div>

</section>

function inkWave(){const cv=q('.wave');if(!cv)return;const r=devicePixelRatio||1,W=cv.width=cv.clientWidth*r,H=cv.height=cv.clientHeight*r,g=cv.getContext('2d');g.fillStyle=getComputedStyle(cv).color;
 g.globalAlpha=.7;const n=Math.floor(W/(5*r));for(let i=0;i<n;i++){const v=Math.abs(Math.sin(i*.37)*Math.sin(i*.11+1))*.8+.12,bh=Math.max(2*r,v*H*.55);g.fillRect(i*5*r,(H-bh)/2,2*r,bh)}}
function noMic(){stopRec(true);const r=q('.recarea'),t=q('.rectg');if(r)r.hidden=true;if(t)t.remove();toast('この端末では録音できないため、ボイスメモを選んでください')}
function meter(st){try{ac=new(window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(st).connect(an);
 const buf=new Uint8Array(an.fftSize),cv=q('.wave'),g=cv.getContext('2d'),col=getComputedStyle(cv).color,hist=[],r=devicePixelRatio||1;
 const loop=()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));hist.push(m/128);
  const W=cv.width=cv.clientWidth*r,H=cv.height=cv.clientHeight*r,n=Math.floor(W/(5*r)),h=hist.slice(-n);g.fillStyle=col;g.globalAlpha=.7;
  h.forEach((v,i)=>{const bh=Math.max(2*r,Math.min(1,v*1.6)*H*.6);g.fillRect(W-(h.length-i)*5*r,(H-bh)/2,2*r,bh)});raf=requestAnimationFrame(loop)};loop()}catch(e){}}
/* 動画を選んだときは、声だけを取り出して小さな音声ファイルにする（映像は保存しない） */
async function audioOnly(file){
 if(file.size>400*1024*1024)throw new Error('big');
 const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
 let buf;try{buf=await new Promise(async(ok,ng)=>{try{const p=ctx.decodeAudioData(await file.arrayBuffer(),ok,ng);if(p&&p.catch)p.catch(ng)}catch(e){ng(e)}})}finally{ctx.close().catch(()=>{})}
 const SR=22050,n=Math.max(1,Math.ceil(buf.duration*SR)),off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,n,SR),src=off.createBufferSource();
 src.buffer=buf;src.connect(off.destination);src.start();const out=(await off.startRendering()).getChannelData(0);
 const dv=new DataView(new ArrayBuffer(44+out.length*2)),W=(o,t)=>[...t].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
 W(0,'RIFF');dv.setUint32(4,36+out.length*2,true);W(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);W(36,'data');dv.setUint32(40,out.length*2,true);
 for(let i=0;i<out.length;i++){const v=Math.max(-1,Math.min(1,out[i]));dv.setInt16(44+i*2,v<0?v*0x8000:v*0x7fff,true)}

  <p>長い動画は取り出しに時間がかかります。3分くらいまでがおすすめです。</p></div>`;
 const close=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o||e.target.closest('.x'))close()});document.body.append(o)}
const b64=b=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(b)});
function sealBtnBack(){q('.act').innerHTML='<button class="btn full seal">封をする</button><p class="note" style="text-align:center;margin:10px 0 0">封をしたら、開封の日まで聞き返せません</p>';q('.seal').addEventListener('click',confirmSeal)}

 if(!voice){toast('ボイスメモか動画を選んでください');return}
 q('.act').innerHTML=`<p class="sub" style="text-align:center">${ageLabel(fAge)}の手紙として封をします。<br>開封の日まで聞き返せません。</p><div class="pair"><button class="btn ghost back">もどる</button><button class="btn go">封をする</button></div>`;
 q('.back').addEventListener('click',sealBtnBack);

}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* 手紙をしまって、ロウで封をして、ビューンと飛んでいく */
function sealAnim(age){
 const RMs=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let w='';for(let i=0;i<40;i++){const v=Math.abs(Math.sin(i*.41)*Math.sin(i*.13+1.2))*.85+.15,bh=4+v*40;w+=`<rect x="${(132+i*6.4).toFixed(1)}" y="${(262-bh/2).toFixed(1)}" width="2.6" height="${bh.toFixed(1)}" rx="1.3"/>`}
 const gold=age===S.openAge,WI=gold?x=>waxGold(waxInner(x)):waxInner,WB=gold?()=>waxGold(waxBlob()):waxBlob;
 const o=document.createElement('div');o.className='so'+(gold?' red':'');
 o.innerHTML=`<svg viewBox="0 0 520 420" aria-hidden="true"><defs><radialGradient id="waxF" cx=".36" cy=".34" r=".75"><stop offset="0" style="stop-color:var(--sealHi)"/><stop offset="1" style="stop-color:var(--seal)"/></radialGradient></defs>

   <rect class="i-paper" x="40" y="114" width="440" height="276" rx="6"/>
   <path class="i-paper so-flapo" d="M40 114 L260 6 L480 114 Z"/>
   <g class="so-letter i-letter" style="opacity:1"><rect class="p" x="78" y="128" width="364" height="230" rx="4"/><text x="260" y="196" style="letter-spacing:.08em">Voice Letter</text><g class="w">${w}</g></g>
   <path class="i-paper" d="M40 114 L260 292 L480 114 L480 384 Q480 390 474 390 L46 390 Q40 390 40 384 Z"/><path class="fold" d="M46 386 L252 298 M474 386 L268 298"/><path class="tex" d="M40 114 L260 292 L480 114 L480 384 Q480 390 474 390 L46 390 Q40 390 40 384 Z"/>
   <path class="i-paper so-flap" d="M40 114 L260 292 L480 114 Z"/><path class="tex so-flap" d="M40 114 L260 292 L480 114 Z"/>
   <g class="so-wax"><svg id="soWax" x="194" y="227" width="132" height="132" viewBox="0 0 100 100" overflow="visible" class="wsv"><g class="wb">${WB()}</g><g class="wi">${WI(age)}</g><g class="wsh">${STAMP_SHD}</g><g class="wst">${STAMP}</g></svg></g>
  </g></svg><p class="so-msg"><b>封をして、大切にしまっておきますね</b><span class="sub"></span></p>`;
 document.body.append(o);
 {const w=o.querySelector('#soWax');if(RMs)w.querySelector('.wi').style.opacity=1;else stampRun(w,1750)}

 return{

async function doSeal(){

  S=await call(edit?'replaceVoice':'saveLetter',...(edit?[edit,p]:[p]));

/* ---- 開ける ---- */
function lock(id){
 const l=S.letters.find(x=>x.id===id),early=new Date()<new Date(S.openAt);
 const head=`<p class="eyebrow">${ageLabel(l.age)} · ${esc(l.author)}より${l.seconds?' · 声 '+mmss(l.seconds):''}</p>`;
 if(!early){show(`<div class="lock">${head}<h3>開封の日です</h3><button class="btn full" id="go" style="margin-top:22px">手紙を開ける</button></div>`);$('#go').addEventListener('click',()=>reveal(id));return}
 show(`<div class="lock">${head}<h3>封をした手紙です</h3>
  <p class="sub">封を${HOLD_MS/1000}秒長押しすると、開いて編集できます。</p>
  <button class="hold" id="hold" aria-label="封を長押しする"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="46"/><circle class="prog" id="prog" cx="50" cy="50" r="46"/></svg><span class="wx">${waxSvg(l.age)}</span></button>
  <p class="sub" id="holdHint">長押し</p></div>`);
 const L=2*Math.PI*46,pr=$('#prog'),btn=$('#hold');pr.style.strokeDasharray=L;pr.style.strokeDashoffset=L;
 let st=0,rf=0,done=false;
 const step=t=>{const p=Math.min(1,(t-st)/HOLD_MS);pr.style.strokeDashoffset=L*(1-p);$('#holdHint').textContent=p<1?`あと ${Math.ceil((HOLD_MS-(t-st))/1000)} 秒`:'開けています…';
  if(p>=1){done=true;reveal(id);return}rf=requestAnimationFrame(step)};
 const start=e=>{if(done)return;e.preventDefault();st=performance.now();rf=requestAnimationFrame(step)};
 const stop=()=>{if(done)return;cancelAnimationFrame(rf);pr.style.strokeDashoffset=L;$('#holdHint').textContent='長押し'};
 btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(v=>btn.addEventListener(v,stop));
 btn.addEventListener('contextmenu',e=>e.preventDefault());
}
async function reveal(id){
 try{const r=await call('openLetter',id);if(r.early)S=await call('getState');render();
  show(`<p class="eyebrow">${ageLabel(r.age)} · ${esc(r.author)}より · ${fmtD(r.createdAt)}</p><h3>${r.age===0?'生まれた日の':r.age+'歳の'}${esc(toName(S.name))}へ</h3>
   ${r.voice?`<audio controls src="${r.voice}"></audio>`:r.sample?'<p class="note">サンプルのため、声はありません。</p>':''}
   <div id="edAct"><div class="pair" style="margin-top:22px"><button class="btn ghost" id="delBtn">この手紙を消す</button><button class="btn" id="reBtn">声を録り直す</button></div>
   <p class="note" style="margin-top:14px;text-align:center">閉じると、また封をした状態に戻ります。</p></div>`);
  $('#reBtn').addEventListener('click',()=>{const l=S.letters.find(x=>x.id===id);show('<h3>声を録り直す</h3><div id="sform" style="margin-top:20px"></div>');$('#form').innerHTML='';compose($('#sform'),l.age,id)});
  $('#delBtn').addEventListener('click',()=>{$('#edAct').innerHTML=`<p class="sub" style="text-align:center;margin-top:22px">${ageLabel(r.age)}の${esc(r.author)}の手紙を消します。<br>声のファイルはドライブのゴミ箱に移ります。</p><div class="pair"><button class="btn ghost" id="noDel">やめる</button><button class="btn" id="yesDel" style="background:var(--warn);border-color:var(--warn)">消す</button></div>`;
   $('#noDel').addEventListener('click',()=>reveal(id));
   $('#yesDel').addEventListener('click',async()=>{$('#yesDel').disabled=true;try{S=await call('deleteLetter',id);render();compose($('#form'),targetAge());hide();toast('手紙を消しました')}catch(e){toast(e.message||String(e))}})});
 }catch(e){const h=$('#holdHint');if(h)h.textContent=e.message||String(e);else toast(e.message||String(e))}
}
function addVoice(a){stopRec(true);show('<h3>声を入れる</h3><div id="sform" style="margin-top:20px"></div>');$('#form').innerHTML='';compose($('#sform'),a)}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.env');if(!b||b.disabled)return;

/* ======== 受け取る側 ======== */
function renderGift(){

 $('#gBack').hidden=!fromParent;
 $('#gCount').innerHTML='';$('#gClock').innerHTML='';$('#gList').innerHTML='';$('#gCta').innerHTML='';$('#gNote').textContent='';
 if(!G.opened){
  $('#gTitle').textContent=`${name}へ`;
  $('#gSub').innerHTML=`この手紙は、${G.openAge}歳の誕生日<br>（${fmtJ(G.openAt)}）に開けられます。`;
  $('#gNote').innerHTML=`<span style="display:block;font:500 17px/2 'Shippori Mincho',serif;color:var(--ink)">その日まで、<br>楽しみに待っていてください。</span>`;
  return}

 {const t=`${from}から、${name}へ`;$('#gTitle').textContent=t;$('#gTitle').style.cssText=`white-space:nowrap;font-size:min(46px,calc((100vw - 44px) / ${t.length}))`}

 {const el=$('#gHrs'),t0=performance.now(),RMg=matchMedia('(prefers-reduced-motion:reduce)').matches;const f=t=>{const p=RMg?1:Math.min(1,(t-t0)/2200);el.textContent=Math.round(hrs*(1-Math.pow(1-p,4))).toLocaleString('ja-JP');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
 const seen=new Set((store.get('vl-seen')||'').split(',').filter(Boolean));
 $('#gList').className='envs';
 /* 0歳〜17歳の18通ぶんを並べる（声のない年は空の封筒） */
 let k=0;const envSvg=inner=>`<svg viewBox="0 0 120 84"><rect class="pp" x="1" y="1" width="118" height="82" rx="4"/><path class="fl" d="M2 4 L60 52 L118 4"/>${inner}</svg>`;
 $('#gList').innerHTML=Array.from({length:G.openAge+1},(_,a)=>{const red=a===G.openAge?' red':'',W=red?x=>waxGold(waxInner(x)):waxInner;const ls=G.letters.map((l,i)=>[l,i]).filter(([l])=>l.age===a),lab=a===0?'誕生':a+'歳';
  if(!ls.length)return `<button class="env gift none${red}" disabled aria-label="${lab}の手紙はありません">${envSvg(`<text class="en" x="60" y="76">${a}</text>`)}<small>${lab}</small></button>`;
  const who=names(ls.map(([l])=>l)).map(esc).join('・');
  return `<button class="env sealed gift${red} ${ls.every(([l])=>seen.has(l.id))?'seen':''}" data-a="${a}" style="animation-delay:${((k++)*.06).toFixed(2)}s" aria-label="${ageLabel(a)}・${who}より">${envSvg(`<svg x="39" y="32" width="42" height="42" viewBox="0 0 100 100" overflow="visible" class="wsv">${W(a)}</svg>`)}<small>${lab} ${who}</small></button>`}).join('');
}
$('#gList').addEventListener('click',e=>{const b=e.target.closest('.env');if(b&&!b.disabled)giftLetter(+b.dataset.a)});
/* その年の手紙を開く（パパとママの両方があれば、続けて並べる） */
function giftLetter(a){
 const ls=mamaFirst(G.letters.filter(l=>l.age===a));
 show(`<div class="reveal"><div class="unseal">${waxSvg(a)}</div><p class="eyebrow">${ageLabel(a)}</p><h3>${a===0?'生まれた日の':a+'歳の'}${esc(toName(G.name))}へ</h3>${ls.map((l,i)=>`<div style="margin-top:24px"><p class="eyebrow">${esc(l.author)}より · ${fmtD(l.createdAt)}</p><p class="sub" id="gLoad${i}">封を開けています…</p><div id="gBody${i}"></div></div>`).join('')}</div>`);
 onHide=renderGift;
 ls.forEach(async(l,i)=>{const ld=$('#gLoad'+i);
  if(G.preview&&(LIVE||WEB)){ld.textContent='プレビューです。声は開封日から聴けます。';return}
  try{const r=await call('giftOpen',GKEY,l.id);
   const seen=new Set((store.get('vl-seen')||'').split(',').filter(Boolean));seen.add(l.id);store.set('vl-seen',[...seen].join(','));

   $('#gBody'+i).innerHTML=r.voice?`<audio controls src="${r.voice}"></audio>`:r.sample?'<p class="note" style="margin-top:14px">サンプルのため、声はありません。</p>':'';
  }catch(e){if(ld.isConnected)ld.textContent=e.message||String(e)}});
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)hide()});
$('#mode').textContent=(LIVE||WEB)?'':'プレビュー（サンプル表示）';
boot();
}
